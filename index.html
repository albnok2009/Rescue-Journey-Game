<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>رحلة الإنقاذ</title><style>body{font-family:Tahoma;text-align:center;color:white;background:linear-gradient(#194c42,#142e5d)}main{max-width:680px;margin:auto}h1{color:#ffda78}button,input,select{font:inherit;padding:13px;margin:6px;border-radius:12px}button{background:#ffda78;color:#172e50;border:0;font-weight:bold}.choices{display:grid;grid-template-columns:1fr 1fr}.panel{background:#001c3980;border-radius:18px;padding:16px;margin:16px 0}#scene{font-size:44px;background:#6fae84;padding:25px;border-radius:20px}</style><main><h1>🌳 رحلة الإنقاذ</h1><section id="setup" class="panel"><input id="name" placeholder="اسم البطل"><p><select id="level"></select></p><p>٢٠ خطوة لكل مستوى — الخطأ يعيدك خطوة</p><button onclick="start()">ابدأ</button><button onclick="resume()">استكمال المحفوظ</button></section><section id="game" class="panel" hidden><h2 id="progress"></h2><div id="scene">🌲 🧒 🌳 🏡 👨‍👩‍👦</div><h2 id="question"></h2><div id="choices" class="choices"></div><p id="feedback"></p><button onclick="home()">حفظ وخروج</button></section><section id="win" class="panel" hidden><h2>🏆 اكتملت رحلة الإنقاذ!</h2><p id="summary"></p><button onclick="download()">حفظ شهادة PNG</button><button onclick="share()">مشاركة الشهادة</button><button onclick="next()">المستوى التالي</button><button onclick="home()">الرئيسية</button></section></main><script>let $=x=>document.getElementById(x),d=x=>String(x).replace(/[0-9]/g,n=>'٠١٢٣٤٥٦٧٨٩'[+n]),s=null,locked=false;for(let i=1;i<=10;i++)$('level').add(new Option('المستوى '+d(i),i));function save(){localStorage.setItem('rescue-game',JSON.stringify(s))}function view(id){for(let n of ['setup','game','win'])$(n).hidden=n!==id}function start(){if(!$('name').value.trim()){alert('اكتب اسم البطل');return}s={name:$('name').value.trim(),level:+$('level').value,pos:0,correct:0,wrong:0,q:null};save();draw()}function resume(){try{s=JSON.parse(localStorage.getItem('rescue-game'));if(!s)throw 0;draw()}catch(e){alert('لا توجد رحلة محفوظة')}}function make(){let max=s.level<=3?5:s.level<=6?8:10,a=1+Math.floor(Math.random()*max),b=1+Math.floor(Math.random()*10),ans=a*b,opts=new Set([ans]);while(opts.size<4){let n=ans+Math.floor(Math.random()*31)-15;if(n>0&&n<=100)opts.add(n)}s.q={a,b,ans,opts:[...opts].sort(()=>Math.random()-.5)};save()}function draw(){if(s.pos>=20){finish();return}view('game');locked=false;if(!s.q)make();$('progress').textContent=s.name+' | المستوى '+d(s.level)+' | التقدم '+d(s.pos)+' / ٢٠ | صحيح '+d(s.correct)+' | خطأ '+d(s.wrong);$('question').textContent=d(s.q.a)+' × '+d(s.q.b)+' = ؟';$('feedback').textContent='';$('choices').innerHTML='';s.q.opts.forEach(n=>{let b=document.createElement('button');b.textContent=d(n);b.onclick=()=>answer(n);$('choices').append(b)})}function answer(n){if(locked)return;locked=true;let ok=n===s.q.ans;s.correct+=ok?1:0;s.wrong+=ok?0:1;s.pos=Math.max(0,Math.min(20,s.pos+(ok?1:-1)));s.q=null;save();$('feedback').textContent=ok?'أحسنت! تقدم الطفل خطوة':'إجابة خاطئة، عاد الطفل خطوة';[...$('choices').children].forEach(b=>b.disabled=true);setTimeout(draw,1000)}function finish(){view('win');$('summary').textContent=s.name+' — المستوى '+d(s.level)+' — الإجابات الصحيحة '+d(s.correct);localStorage.removeItem('rescue-game')}function home(){view('setup')}function next(){s={name:s.name,level:Math.min(10,s.level+1),pos:0,correct:0,wrong:0,q:null};save();draw()}async function certificate(){let c=document.createElement('canvas');c.width=1240;c.height=1754;let x=c.getContext('2d');x.fillStyle='#fffdf6';x.fillRect(0,0,1240,1754);x.strokeStyle='#173b67';x.lineWidth=18;x.strokeRect(50,50,1140,1654);x.textAlign='center';x.direction='rtl';function line(t,y,size,color){x.fillStyle=color;x.font='bold '+size+'px Tahoma,Arial';x.fillText(t,620,y,1040)}line('🏆',290,110,'#d5a436');line('شهادة شكر وتقدير',440,80,'#173b67');line('مبادرة رحلة الإنقاذ',600,58,'#ad842d');line('تُمنح إلى البطل',760,45,'#173b67');line(s.name,900,75,'#173b67');line('لإنقاذ الطفل وإعادته إلى أسرته',1070,46,'#173b67');line('المستوى '+d(s.level),1180,40,'#173b67');line('إدارة التطبيق: محمد حمد',1440,35,'#173b67');line('توقيع ولي الأمر: ...................',1530,35,'#173b67');return new Promise(r=>c.toBlob(r,'image/png'))}async function download(){let b=await certificate(),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='شهادة-رحلة-الإنقاذ.png';a.click();setTimeout(()=>URL.revokeObjectURL(u),2000)}async function share(){let b=await certificate(),f=new File([b],'certificate.png',{type:'image/png'});if(navigator.canShare?.({files:[f]}))try{await navigator.share({files:[f]})}catch(e){}else alert('احفظ الشهادة وشاركها من الصور')}</script></html>
